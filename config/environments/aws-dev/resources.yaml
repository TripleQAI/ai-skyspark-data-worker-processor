# AWS development resources. Packaged unchanged at /app/resources.yaml in the
# worker, control, and Lambda images, and passed to Terraform as
# resource_config_file. Bucket names are globally unique; change all three
# (here and in the foundation bucket_names input) before the first apply.
region: us-east-1
buckets:
  - skyspark-dev-raw-001634074733
  - skyspark-dev-certified-001634074733
  - skyspark-dev-quarantine-001634074733
work_queues:
  - history_live
  - rules_nightly
  - metadata_sweep
  - backfill
backfill_queue: backfill
feed_routes:
  history: history_live
  rules: rules_nightly
  metadata: metadata_sweep
max_receive_count: 4
dispatch:
  batch_limit: 500
  lease_seconds: 120
  base_backoff_seconds: 5
  max_backoff_seconds: 300
publication:
  event_bus: skyspark-certified-dev
  source: insite.skyspark.ingestion
  detail_type: SkySparkCertifiedBatch
  batch_limit: 500
  lease_seconds: 120
  base_backoff_seconds: 5
  max_backoff_seconds: 300
recovery:
  batch_limit: 500
  expired_running_after_seconds: 900
  never_started_after_seconds: 86400
  max_redrives: 2
backfill:
  max_source_calls_per_project: 2
  job_slots_per_task: 2
  max_jobs_per_request: 100000
  max_window_age_days: 30
  max_request_age_hours: 24
  clock_skew_minutes: 5
measurement:
  max_s3_objects_per_prefix: 1000000
control_loop:
  dispatch_idle_seconds: 1
  publication_idle_seconds: 2
  recovery_idle_seconds: 60
metadata_inspection:
  max_csv_bytes: 67108864
  max_equipment_rows: 10000
  max_point_rows: 100000
  max_issue_examples: 20
  historized_true_values: ['true', 'm:', '✓']
  historized_false_values: ['', 'false']
metadata_read:
  # One page per kind. A 200 x 50 replica site is 200 equipment + 10,000 points.
  max_pages_per_kind: 1
  max_rows_per_page: 50000
  max_entities_per_site: 50000
  max_page_bytes: 134217728
  request_timeout_seconds: 120
history_read:
  max_ids: 500
  max_rows: 10000
  max_observations: 100000
  max_response_bytes: 67108864
  request_timeout_seconds: 60
  max_split_depth: 12
  max_descendant_jobs: 8192
  min_split_window_seconds: 30
rules_read:
  max_ids: 200
  max_rows: 50000
  max_response_bytes: 67108864
  request_timeout_seconds: 120
source_client:
  # "observed": the receipt is derived from the SkySpark response (no error
  # grid, no truncation marker, every requested ID answered). Development and
  # scale testing only; production stays "provider" until SkySpark supplies a
  # completeness receipt.
  receipt_mode: observed
  # ECS injects the Secrets Manager JSON {"username": ..., "password": ...}
  # under this name (infra/workers source_secret_arns).
  credentials_env: SKYSPARK_SOURCE_CREDENTIALS
  equipment_filter: equip
  point_filter: point
  truncation_meta_markers: [trunc, limit]
  verify_rules_equipment_scope: true
config_artifacts:
  max_bundle_bytes: 1048576
inventory_artifacts:
  # 1,000 sites x 10,200 IDs is several hundred MB of inventory JSON.
  max_snapshot_bytes: 1073741824
  max_age_hours: 336
workflow:
  poll_seconds: 30
  max_run_seconds:
    history: 900
    rules: 10800
    metadata: 14400
worker:
  job_slots: 4
  config_cache_entries: 128
  sqs_batch_size: 4
  long_poll_seconds: 20
  visibility_seconds: 900
  lease_seconds: 900
  heartbeat_seconds: 60
  source_permit_lease_seconds: 900
  source_permit_heartbeat_seconds: 60
  source_permit_retry_seconds: 1
  scale_in_protection:
    enabled: false
    expires_minutes: 30
    refresh_seconds: 300
    http_timeout_seconds: 3
storage:
  # Must match the `buckets:` list above AND the foundation root's bucket_names
  # input -- infra/foundation/main.tf's precondition compares all three, so a
  # rename in one place alone fails the plan rather than creating a bucket
  # nothing writes to.
  raw_bucket: skyspark-dev-raw-001634074733
  certified_bucket: skyspark-dev-certified-001634074733
  max_raw_bytes: 268435456
  max_certified_bytes: 268435456
  max_certified_rows: 200000
  history_correction_policy: append_revision
