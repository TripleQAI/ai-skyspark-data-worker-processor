# Approved site scope for the AWS development scale test.
#
# Every generated site duplicates one real SkySpark site. Each site presents
# replica.equipment_per_site equipment with replica.points_per_equipment
# historized points each, under site-namespaced IDs, and reads the real site's
# values. Expand with:
#
#   python scripts/generate_scale_binding.py --scope config/environments/aws-dev/scope.yaml
#
# The output binding goes to the git-ignored private/ folder because it names
# the real source site. Replace every REPLACE_ value first; the generator
# refuses placeholders.
schema_version: 1
profile_id: aws-dev
tenant_id: dev-tenant
project_id: dev-scale
# The project's Haystack API URL: the SkySpark API root plus the project name.
# HTTPS to a hostname, not the plain-HTTP bare IP the template shipped with.
endpoint: https://insiot.insiteintelligence.com/api/launchPad_ca141bd38c8fe5081
# Secrets Manager secret holding {"username": ..., "password": ...}.
secret_ref: aws-secretsmanager://arn:aws:secretsmanager:us-east-1:001634074733:secret:tripleq/development/skyspark/credentials
# The real site every replica duplicates: its Haystack id, without "@".
# From readAll(site): "One Hughes Landing". The colons are part of the Haystack
# ref, not a separator -- the generator's pattern admits them deliberately.
source_site_ref: p:launchPad_ca141bd38c8fe5081:r:2c2c8620-747a608c
sites:
  count: 1000
  first_index: 1
  # Python format string; letters, digits, _ and - only.
  ref_format: "dev-site-{index:04d}"
replica:
  equipment_per_site: 200
  points_per_equipment: 50
history_source_lag_minutes: 5
history_lookback_windows: 0
# The source site's IANA zone and the tz tag SkySpark writes on rule rows.
#
# TWO SPELLINGS OF ONE ZONE, deliberately not merged. SkySpark writes the short
# Haystack name ("Chicago") on its rows; ZoneInfo needs the full IANA name, and
# contracts/config.py validates it with ZoneInfo(), where bare "Chicago" raises
# ZoneInfoNotFoundError. Matching rows uses the first; computing day boundaries
# uses the second.
rules_source_timezone: America/Chicago
rules_source_tz_tags: [Chicago]
rules_settlement_minutes: 60
rules_lookback_days: 0
