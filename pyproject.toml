[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-skyspark-data-worker-processor"
version = "0.1.0"
description = "Config-driven SkySpark ingestion workers"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35,<2",
  "pydantic>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
source = ["phable"]
dev = ["pytest>=8,<10"]

[project.scripts]
skyspark-ingestion = "ingestion.cli:main"
skyspark-control = "ingestion.control_cli:main"
skyspark-schedules = "ingestion.schedule_cli:main"
skyspark-workflow = "ingestion.workflow_cli:main"
skyspark-source-probe = "ingestion.probe_cli:main"
skyspark-standalone-script = "ingestion.standalone_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
